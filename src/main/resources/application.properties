spring.application.name=product_service
server.port=${SERVER_PORT:8082}

# Datasource (override with environment variables outside local development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elurea_product_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Pagination
spring.data.web.pageable.max-page-size=100

# Errors: never leak stack traces or exception messages to clients
server.error.include-stacktrace=never
server.error.include-message=never

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Application settings ---

# JWT issued by the user service: secret and issuer MUST match the user service configuration.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
app.jwt.issuer=elurea-user-service

# Shared key for service-to-service calls (e.g. order service reserving stock), sent as X-Internal-Api-Key.
# The default is for local development only. Set INTERNAL_API_KEY to a long random value in any other environment.
app.internal-api-key=${INTERNAL_API_KEY:local-dev-internal-key}

# Browser origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Image storage on the local disk. public-base-url is how browsers reach /uploads: through the gateway,
# which routes /uploads/avatars to the user service and /uploads/products to the product service.
app.storage.local-dir=${STORAGE_DIR:uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:8000/uploads}
